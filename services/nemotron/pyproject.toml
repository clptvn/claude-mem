[project]
name = "claude-mem-nemotron"
version = "0.1.0"
description = "Shared Apple Silicon embedding and vector service for claude-mem"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.5.0,<2",
  "fastapi>=0.115,<2",
  "httpx>=0.28,<1",
  "sentence-transformers>=5.4.1,<6",
  "torch>=2.7,<3",
  "transformers>=5.2.0,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
claude-mem-nemotron = "nemotron_memory_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nemotron_memory_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
